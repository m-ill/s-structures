<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-Structures 사용 안내서</title>
<style>
:root{ --dku:#00467F; --dku2:#0A5CA8; --gold:#E8A11C; --panel:#f2f6fa; --line:#c9d7e4; --ink:#223; }
*{ box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI','Malgun Gothic',sans-serif; }
body{ background:#eef2f7; color:var(--ink); }
header.app{ position:sticky; top:0; z-index:5; background:var(--dku); color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
header.app .logo{ font-weight:700; letter-spacing:.4px; margin-right:4px; }
header.app .logo span{ color:var(--gold); }
header.app nav.tabs{ display:flex; gap:6px; }
header.app nav.tabs a{ color:#d7e5f2; font-size:13px; text-decoration:none; padding:5px 12px; border-radius:6px; border:1px solid transparent; }
header.app nav.tabs a.current{ background:var(--dku2); color:#fff; font-weight:600; }
header.app nav.tabs a:not(.current){ border-color:rgba(255,255,255,.3); }
header.app .spacer{ flex:1; }
header.app a.home{ color:#d7e5f2; font-size:13px; text-decoration:none; border:1px solid rgba(255,255,255,.35); padding:4px 10px; border-radius:6px; }
.layout{ display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 52px); }
nav.sidebar{ background:var(--panel); border-right:1px solid var(--line); padding:14px 12px 40px; overflow-y:auto; position:sticky; top:52px; height:calc(100vh - 52px); }
nav.sidebar h3{ font-size:12.5px; color:#678; margin:14px 0 4px; text-transform:none; }
nav.sidebar ul{ list-style:none; }
nav.sidebar li a{ display:block; padding:4px 9px; font-size:13.5px; color:#345; text-decoration:none; border-radius:5px; }
nav.sidebar li a:hover{ background:#e2ecf5; }
nav.sidebar li a.active{ background:var(--dku2); color:#fff; }
main.content{ padding:28px 38px 90px; max-width:860px; }
main.content .doc-meta{ font-size:12px; color:#789; margin-bottom:14px; }
main.content h1{ font-size:23px; color:var(--dku); border-bottom:2px solid var(--dku); padding-bottom:6px; margin:4px 0 14px; }
main.content h2{ font-size:18px; color:var(--dku2); margin:26px 0 8px; }
main.content h3{ font-size:15px; margin:18px 0 6px; }
main.content h4{ font-size:13.5px; margin:14px 0 4px; }
main.content p{ font-size:14px; line-height:1.75; margin:8px 0; }
main.content ul, main.content ol{ padding-left:24px; margin:8px 0; font-size:14px; line-height:1.8; }
main.content table{ border-collapse:collapse; margin:12px 0; width:100%; font-size:13px; background:#fff; }
main.content th, main.content td{ border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; line-height:1.55; }
main.content th{ background:#e8f0f8; color:var(--dku); }
main.content pre{ background:#0f2438; color:#dce9f5; border-radius:8px; padding:12px 14px; overflow-x:auto; margin:10px 0; }
main.content pre code{ font-size:12.5px; font-family:Consolas,'D2Coding',monospace; }
main.content p code, main.content li code, main.content td code{ background:#eef4fa; border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:12.5px; }
main.content blockquote{ border-left:4px solid var(--gold); background:#fffaf0; padding:8px 14px; margin:10px 0; font-size:13.5px; }
main.content a{ color:var(--dku2); }
.pager{ display:flex; justify-content:space-between; gap:10px; margin-top:34px; padding-top:16px; border-top:1px solid var(--line); }
.pager a{ font-size:13px; text-decoration:none; color:var(--dku2); border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:8px; max-width:48%; }
.pager .next{ margin-left:auto; text-align:right; }
.load-error{ background:#fdecec; border:1px solid #e8b4b4; color:#8a2424; border-radius:8px; padding:12px 16px; font-size:13.5px; }
@media print{ header.app, nav.sidebar, .pager{ display:none; } .layout{ display:block; } }
@media (max-width:760px){ .layout{ grid-template-columns:1fr; } nav.sidebar{ position:static; height:auto; max-height:300px; } }
</style>
</head>
<body>
<header class="app">
  <div class="logo">S-<span>Structures</span> 도움말</div>
  <nav class="tabs">
    <a class="current" href="./guide.html">사용 안내서</a>
    <a href="./manual.html">기능 설명서</a>
  </nav>
  <div class="spacer"></div>
  <a class="home" href="./app.html">앱으로</a>
</header>
<div class="layout">
  <nav class="sidebar" id="guideNav" aria-label="안내서 목차"></nav>
  <main class="content">
    <div class="doc-meta" id="guideMeta"></div>
    <div id="guideContent"></div>
    <div class="pager" id="guidePager"></div>
  </main>
</div>
<script type="module">
import { GUIDE_GROUPS, listGuidePages, findGuidePage } from './src/platform/guidePages.js';
import { renderMarkdown, escapeHtml } from './src/platform/markdownRender.js';

const nav = document.getElementById('guideNav');
const content = document.getElementById('guideContent');
const meta = document.getElementById('guideMeta');
const pager = document.getElementById('guidePager');
const pages = listGuidePages();
const DEFAULT_PAGE = '01-getting-started';

function renderNav(activeId) {
  nav.innerHTML = GUIDE_GROUPS.map((group) => `
    <h3>${escapeHtml(group.name)}</h3>
    <ul>${group.pages.map((item) => `
      <li><a href="#${escapeHtml(item.id)}" class="${item.id === activeId ? 'active' : ''}">${escapeHtml(item.title)}</a></li>
    `).join('')}</ul>
  `).join('');
}

function renderPager(activeId) {
  const position = pages.findIndex((item) => item.id === activeId);
  const previous = pages[position - 1];
  const next = pages[position + 1];
  pager.innerHTML = [
    previous ? `<a href="#${escapeHtml(previous.id)}">← ${escapeHtml(previous.title)}</a>` : '',
    next ? `<a class="next" href="#${escapeHtml(next.id)}">${escapeHtml(next.title)} →</a>` : '',
  ].join('');
}

async function showPage(pageId) {
  const page = findGuidePage(pageId) || findGuidePage(DEFAULT_PAGE);
  renderNav(page.id);
  renderPager(page.id);
  meta.textContent = `${page.groupName} · ${page.file}`;
  try {
    const response = await fetch(`./${page.file}`, { cache: 'no-cache' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    content.innerHTML = renderMarkdown(await response.text());
    window.scrollTo(0, 0);
  } catch (error) {
    content.innerHTML = `<div class="load-error">문서를 불러오지 못했습니다 (${escapeHtml(page.file)} — ${escapeHtml(error.message)}). 서버로 접속했는지 확인하세요: 파일을 직접 열면(file://) 안내서를 읽을 수 없습니다.</div>`;
  }
}

function currentPageId() {
  return decodeURIComponent((location.hash || '').slice(1)) || DEFAULT_PAGE;
}

window.addEventListener('hashchange', () => showPage(currentPageId()));
showPage(currentPageId());
</script>
</body>
</html>
