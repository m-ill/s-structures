name: Deploy validated Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/phase21.yml
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: node tools/check-p21-release-gate.mjs
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: python tools/build-pages.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [validate, release-gate, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated static files
        id: deployment
        uses: actions/deploy-pages@v4
